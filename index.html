<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Экскурсия по карте</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="app">
            <aside class="side">
                <div class="side-head">
                    <h1 id="tourTitle"></h1>
                    <p id="tourSub"></p>
                    <div class="stats">
                        <div><b id="stCount"></b>остановок</div>
                        <div><b id="stDist">—</b>расстояние</div>
                        <div><b id="stTime">—</b>в пути</div>
                    </div>
                    <button class="start" id="startBtn">
                        Начать экскурсию
                    </button>
                </div>
                <div class="progress"><i id="prog"></i></div>
                <ol class="stops" id="stops"></ol>
            </aside>

            <main class="stage">
                <div id="map"></div>
                <div class="notice" id="notice" hidden></div>

                <article class="card" id="card" aria-live="polite">
                    <button
                        class="peek"
                        id="peek"
                        aria-label="Свернуть или развернуть карточку"
                    >
                        <span class="peek-grip"></span>
                    </button>
                    <div class="card-scroll" id="cardScroll">
                        <div class="gallery">
                            <div class="shots" id="shots"></div>
                            <div class="dots" id="dots"></div>
                            <button
                                class="close"
                                id="closeBtn"
                                aria-label="Закрыть"
                            >
                                ×
                            </button>
                        </div>
                        <div class="card-body" id="cardBody"></div>
                    </div>
                    <nav class="card-nav">
                        <button id="prevBtn">Назад</button>
                        <button class="next" id="nextBtn">Дальше</button>
                    </nav>
                </article>
            </main>
        </div>
        <div class="lightbox" id="lightbox"><img alt="" /></div>
        <div class="planfs" id="planFs"><div class="planfs-inner" id="planFsInner"></div></div>

        <script src="data.js"></script>
        <script src="app.js"></script>
    </body>
</html>
